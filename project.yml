name: Expensly
options:
  bundleIdPrefix: de.frankmathy.ios
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "47"
    DEVELOPMENT_TEAM: 9932454228
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Expensly:
    type: application
    platform: iOS
    sources:
      - path: Expensly
    settings:
      base:
        PRODUCT_NAME: Expensly
        # Keep the App Store bundle id so existing installs upgrade in place
        # and keep their Core Data store.
        PRODUCT_BUNDLE_IDENTIFIER: de.frankmathy.ios.Expenses
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Expensly/Info.plist
      properties:
        CFBundleDisplayName: Expensly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        NSLocationWhenInUseUsageDescription: Expensly uses location information to show a map with nearby locations when selecting an expense location.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ExpenslyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ExpenslyTests
    dependencies:
      - target: Expensly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.frankmathy.ios.ExpenslyTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Expensly:
    build:
      targets:
        Expensly: all
        ExpenslyTests: [test]
    test:
      targets:
        - ExpenslyTests
      gatherCoverageData: true
    run:
      config: Debug
